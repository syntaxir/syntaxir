name: CI

# A push to main runs only the light check job. The test suites run on demand: start the workflow by hand
# (Actions tab or `gh workflow run ci.yml --ref <branch> -f suite=<suite>`) and choose the suite.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "check: vet and generated files; root: default test tier; long: long tier (includes root); alpha: alpha-parsers; site: site module; typescript: Node.js WASM and generated TypeScript; all: every suite with the long tier; perf: deterministic metrics of this ref compared with base (not part of all)"
        type: choice
        default: check
        options: [check, root, long, alpha, site, typescript, all, perf]
      base:
        description: "perf: the ref whose deterministic metrics this ref is compared with"
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.suite }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Vet and generated files
    if: github.event_name == 'push' || inputs.suite == 'check' || inputs.suite == 'all'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
      - name: Vet root module
        run: go vet ./...
      - name: Regenerate generated files
        run: go generate ./internal/backend/... ./internal/runtime/state/sharedsrc ./bench ./internal/frontend/parser ./spec/language/... ./internal/optcatalog
      - name: Require an unchanged tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "go generate changed the tree; commit the regenerated files" >&2
            git status --short >&2
            exit 1
          fi

  go-native:
    name: Go root module (${{ inputs.suite == 'root' && 'default' || 'long' }} tier)
    if: inputs.suite == 'root' || inputs.suite == 'long' || inputs.suite == 'all'
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.0
      - name: Install pinned TypeScript reference compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/sxir-typescript" --no-save --ignore-scripts typescript@5.9.3
          echo "$RUNNER_TEMP/sxir-typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
          ref: v5.9.3
          path: typescript-reference
          sparse-checkout: tests/cases
          sparse-checkout-cone-mode: true
      - name: Verify required runtimes and references
        env:
          SXIR_PYTHON: python
          SXIR_TYPESCRIPT: ${{ runner.temp }}/sxir-typescript/node_modules/typescript
          SXIR_TYPESCRIPT_TESTS: ${{ github.workspace }}/typescript-reference/tests/cases
        run: .github/scripts/require-toolchain.sh node tsc python typescript-corpus
      - name: Record test provenance
        env:
          SXIR_PYTHON: python
          SXIR_TYPESCRIPT: ${{ runner.temp }}/sxir-typescript/node_modules/typescript
          SXIR_TYPESCRIPT_REF: ${{ github.workspace }}/typescript-reference
          SXIR_TYPESCRIPT_TESTS: ${{ github.workspace }}/typescript-reference/tests/cases
        run: .github/scripts/write-provenance.sh "$RUNNER_TEMP/sxir-ci-provenance.log"
      - name: Test root module
        env:
          SXIR_TAGS: ${{ inputs.suite == 'root' && '' || 'sxir_long' }}
          SXIR_TIMEOUT: ${{ inputs.suite == 'root' && '45m' || '150m' }}
        run: go test -v -tags="$SXIR_TAGS" -timeout="$SXIR_TIMEOUT" ./... 2>&1 | tee "$RUNNER_TEMP/sxir-root-test.log"
      - name: Vet root module
        run: go vet ./... 2>&1 | tee "$RUNNER_TEMP/sxir-root-vet.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-native-test-logs
          path: ${{ runner.temp }}/sxir-*.log
          if-no-files-found: ignore
          retention-days: 14

  alpha:
    name: alpha-parsers against this tree
    if: inputs.suite == 'alpha' || inputs.suite == 'all'
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: syntaxir
      - uses: actions/checkout@v4
        with:
          repository: syntaxir/alpha-parsers
          path: alpha-parsers
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
          cache-dependency-path: syntaxir/go.sum
      - name: Test alpha-parsers
        env:
          SXIR_ALPHA_PARSERS: ${{ github.workspace }}/alpha-parsers
        run: cd syntaxir && hack/test-alpha-parsers.sh 2>&1 | tee "$RUNNER_TEMP/sxir-alpha-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-parsers-test-logs
          path: ${{ runner.temp }}/sxir-alpha-test.log
          if-no-files-found: ignore
          retention-days: 14

  site:
    name: Site build and JavaScript checks
    if: inputs.suite == 'site' || inputs.suite == 'all'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Require Node.js used by site tests
        run: .github/scripts/require-toolchain.sh node
      - name: Record test provenance
        run: .github/scripts/write-provenance.sh "$RUNNER_TEMP/sxir-ci-provenance.log"
      - name: Test site module
        run: cd site && go test -v -timeout=45m ./... 2>&1 | tee "$RUNNER_TEMP/sxir-site-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-test-logs
          path: |
            ${{ runner.temp }}/sxir-site-test.log
            ${{ runner.temp }}/sxir-ci-provenance.log
          if-no-files-found: ignore
          retention-days: 14

  node-wasm-typescript:
    name: Node.js WASM and generated TypeScript
    if: inputs.suite == 'typescript' || inputs.suite == 'all'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Install pinned TypeScript checker
        run: npm install --global --ignore-scripts typescript@5.9.3
      - name: Require Node.js and TypeScript checker
        run: .github/scripts/require-toolchain.sh node tsc
      - name: Record test provenance
        run: SXIR_TYPESCRIPT="$(npm root -g)/typescript" .github/scripts/write-provenance.sh "$RUNNER_TEMP/sxir-ci-provenance.log"
      - name: Run WebAssembly smoke test in Node.js
        run: go test -v -timeout=20m ./cmd/playground -run '^TestWasmSmoke$' -count=1 2>&1 | tee "$RUNNER_TEMP/sxir-wasm-test.log"
      - name: Run generated TypeScript parser tests and strict type checks
        run: go test -v -timeout=20m ./internal/backend/codegen/common ./internal/backend/codegen/typescript/print -run '^TestGeneratedTS' -count=1 2>&1 | tee "$RUNNER_TEMP/sxir-generated-ts-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-wasm-typescript-test-logs
          path: |
            ${{ runner.temp }}/sxir-*-test.log
            ${{ runner.temp }}/sxir-ci-provenance.log
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Deterministic metrics against ${{ inputs.base }}
    if: inputs.suite == 'perf'
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base }}
          path: base
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          check-latest: false
          cache-dependency-path: head/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - name: Require Node.js used by the TypeScript units
        run: head/.github/scripts/require-toolchain.sh node
      # The metrics are counts and sizes, not times, so the runner's speed and load do not change them.
      - name: Collect the metrics of this ref
        run: cd head && go run ./bench/metrics collect -o "$RUNNER_TEMP/sxir-metrics-head.txt"
      - name: Collect the metrics of the base
        run: |
          if [ ! -d base/bench/metrics ]; then
            echo "the base has no bench/metrics; nothing to compare with" >&2
            exit 0
          fi
          cd base && go run ./bench/metrics collect -o "$RUNNER_TEMP/sxir-metrics-base.txt"
      - name: Compare with the base
        run: |
          if [ ! -f "$RUNNER_TEMP/sxir-metrics-base.txt" ]; then
            echo "no base report; this ref's report is uploaded alone" >&2
            exit 0
          fi
          cd head && go run ./bench/metrics compare "$RUNNER_TEMP/sxir-metrics-base.txt" "$RUNNER_TEMP/sxir-metrics-head.txt" 2>&1 | tee "$RUNNER_TEMP/sxir-metrics-compare.txt"; exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-metrics
          path: ${{ runner.temp }}/sxir-metrics-*.txt
          if-no-files-found: ignore
          retention-days: 30
